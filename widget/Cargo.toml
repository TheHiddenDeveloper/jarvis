[package]
name = "jarvis-widget"
version = "0.1.0"
description = "Jarvis always-on-top desktop widget fronting the local daemon"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "jarvis_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]